name: Build APK

on:
  push:
    branches: [principal]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar projeto Android
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          unzip -q "$ZIP" -d projeto
          cd projeto/DesafioRelampagoAndroid
          echo "Projeto preparado"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        working-directory: projeto/DesafioRelampagoAndroid
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Desafio-Relampago-debug
          path: projeto/DesafioRelampagoAndroid/app/build/outputs/apk/debug/app-debug.apk
